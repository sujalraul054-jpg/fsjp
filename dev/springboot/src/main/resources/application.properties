server.port=8080

# --- H2 database (file-based, so data survives restarts) ---
# The file lives at backend/springboot/data/serialpositiondb.mv.db
spring.datasource.url=jdbc:h2:file:./data/serialpositiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' auto-creates/updates tables from the @Entity classes below.
# Fine for development; a real MySQL migration later would use a proper
# migration tool (e.g. Flyway) instead of relying on this.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- H2 web console, for inspecting the database in a browser ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
